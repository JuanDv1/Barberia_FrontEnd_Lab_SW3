<div class="card bg-dark text-white">
    <div class="card-header">{{ titulo }}</div>
    <div class="card-body">
  
      <form>
        <div class="form-group row">
          <label for="nombre" class="col-form-label col-sm-2">Nombre</label>
          <div class="col-sm-6">
            <input type="text" class="form-control" [(ngModel)]="producto.nombre" name="nombre">
          </div>
        </div>
  
        <div class="form-group row">
          <label for="descripcion" class="col-form-label col-sm-2">Descripción</label>
          <div class="col-sm-6">
            <textarea class="form-control" [(ngModel)]="producto.descripcion" name="descripcion" rows="3"></textarea>
          </div>
        </div>
  
        <div class="form-group row">
          <label for="precio" class="col-form-label col-sm-2">Precio</label>
          <div class="col-sm-6">
            <input type="number" class="form-control" [(ngModel)]="producto.precio" name="precio" step="0.01">
          </div>
        </div>

        <div class="form-group row">
          <label for="categoria" class="col-form-label col-sm-2">Categoría</label>
          <div class="col-sm-6">
            <select class="form-control" [(ngModel)]="producto.objCategoria" name="categoria">
              <option [ngValue]="null" disabled>Seleccione una categoría</option>
              <option *ngFor="let categoria of categorias" [ngValue]="categoria">
                {{ categoria.nombre }}
              </option>
            </select>
          </div>
        </div>

        <div class="form-group row">
          <label for="estado" class="col-form-label col-sm-2">Estado</label>
          <div class="col-sm-6">
            <select class="form-control" [(ngModel)]="producto.estado" name="estado">
              <option [ngValue]="true">Disponible</option>
              <option [ngValue]="false">No Disponible</option>
            </select>
          </div>
        </div>

        <div class="form-group row">
          <label for="imagen" class="col-form-label col-sm-2">Imagen</label>
          <div class="col-sm-6">
            <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*" name="imagen">
            <small class="form-text text-muted">Selecciona una imagen (JPG, PNG, GIF)</small>
            <div *ngIf="imagenPreview" class="mt-2">
              <img [src]="imagenPreview" alt="Preview" style="max-width: 200px; max-height: 200px;">
            </div>
          </div>
        </div>
  
        <div class="form-group row">
          <div class="col-sm-6">
            <button class="btn btn-primary me-2" role="button" (click)='crearProducto()'>Crear</button>
            <button class="btn btn-secondary" role="button" (click)='cancelar()'>Cancelar</button>
          </div>
        </div>
      </form>
  
    </div>
  </div>
